<title>Grocery Tracker | Designed by CB</title>
<style>
:root{--bg:#faf8f3;--card:#fff;--tx:#1f2a24;--mu:#6b756e;--ac:#2f7d4f;--acx:#fff;--bd:#e2ddd0;--warn:#c2410c;--wbg:#fff1e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b18;--card:#212722;--tx:#eef1ee;--mu:#9aa59d;--ac:#5ec58a;--acx:#10261a;--bd:#333b35;--warn:#fb923c;--wbg:#3a2a1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171b18;--card:#212722;--tx:#eef1ee;--mu:#9aa59d;--ac:#5ec58a;--acx:#10261a;--bd:#333b35;--warn:#fb923c;--wbg:#3a2a1c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Kannada",sans-serif}
header{padding:14px 16px 6px;max-width:900px;margin:auto}.brandhead{display:flex;align-items:center;gap:12px}.brandlogo{width:64px;height:64px;object-fit:contain;border-radius:10px}.brandhead h1{font-size:22px}.brandhead h1 small{font-size:13px}
h1{margin:0;font-size:20px}h1 small{display:block;font-size:14px;color:var(--mu);font-weight:500}
nav{display:flex;gap:6px;padding:8px 16px;max-width:900px;margin:auto;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);scrollbar-width:thin}
nav button{flex:none}
main{max-width:1000px;margin:auto;padding:12px 16px 40px}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:8px 13px;cursor:pointer;transition:filter .15s,transform .15s}button:hover{filter:brightness(.97)}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on,button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}.template-link{display:inline-block;padding:8px 12px;border:1px solid var(--bd);border-radius:9px;color:var(--tx);text-decoration:none;background:var(--card)}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 9px;min-width:0;max-width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 8px rgba(20,35,25,.035)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row .n{flex:2 1 130px}.row .k{flex:2 1 120px}.row .q{width:68px}.row .u{width:80px}.row .d{width:134px}.buyflag{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;color:var(--mu)}
h3{margin:14px 0 2px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.low{background:var(--wbg);color:var(--warn);border-radius:99px;padding:1px 8px;font-size:12px}
.mu{color:var(--mu);font-size:13px}.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;max-width:480px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.2)}dialog::backdrop{background:rgba(10,20,12,.45)}.previewtable{width:100%;border-collapse:collapse;font-size:13px}.previewtable th,.previewtable td{border-bottom:1px solid var(--bd);padding:6px;text-align:left;overflow-wrap:anywhere}.previewwrap{max-height:45vh;overflow:auto}.error{color:var(--warn)}
@media(max-width:600px){header{padding:14px 14px 4px}nav{padding:8px 12px}main{padding:8px 12px 32px}.card{padding:10px}.row{align-items:stretch}.row input,.row select{min-height:40px}.row .n,.row .k{flex:1 1 100%}.row .q{width:76px}.row .d{width:145px}.bar>*{flex:1 1 130px}.bar button{min-height:40px}h1{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

function normalizeImportDate(v){

 if(/^\d{4}-\d{2}-\d{2}$/.test(x))return x;
 let m=x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
 if(m){let a=+m[1],b=+m[2],y=+m[3],mo,day;if(a>12){day=a;mo=b}else{mo=a;day=b}if(mo>=1&&mo<=12&&day>=1&&day<=31)return `${y}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
 const d=new Date(x);if(!Number.isNaN(d.getTime()))return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 return x;
}

function vKpi(){
 const ps=S.purchases||[], total=ps.reduce((a,p)=>a+(p.amount!==''&&p.amount!=null&&Number.isFinite(+p.amount)?(+p.amount||0):0),0), months={};
 const itemMonth={};
 ps.forEach(p=>{
  if(p.date&&p.amount!==''&&p.amount!=null&&Number.isFinite(+p.amount)){const m=p.date.slice(0,7);months[m]=(months[m]||0)+(+p.amount)}
  const qty=Number(p.qty), amount=Number(p.amount);
  if(p.date&&p.name&&p.amount!==''&&Number.isFinite(qty)&&qty>0&&Number.isFinite(amount)&&amount>=0){const month=p.date.slice(0,7),key=normName(p.name);itemMonth[key]=itemMonth[key]||{};itemMonth[key][month]=itemMonth[key][month]||{amount:0,qty:0};itemMonth[key][month].amount+=amount;itemMonth[key][month].qty+=qty}
 });
 const keys=Object.keys(months).sort(), latest=keys[keys.length-1], prev=keys[keys.length-2];
 const change=latest&&prev&&months[prev]>0?((months[latest]-months[prev])/months[prev])*100:null;
 let inflation=null,matched=0;
 if(latest&&prev){const deltas=[];Object.values(itemMonth).forEach(byMonth=>{const a=byMonth[prev],b=byMonth[latest];if(a&&b&&a.qty>0&&b.qty>0&&a.amount>0&&b.amount>0){deltas.push(((b.amount/b.qty)-(a.amount/a.qty))/(a.amount/a.qty)*100)}});if(deltas.length){inflation=deltas.reduce((a,b)=>a+b,0)/deltas.length;matched=deltas.length}}
 const money=n=>Number(n||0).toLocaleString('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2});
 return `<div class="card"><h2>Grocery expenditure</h2><div class="row"><b>Total recorded expenditure</b><strong style="margin-left:auto">${money(total)}</strong></div><p class="mu">Calculated from imported purchase-list rows that include an amount. Rows without an amount are excluded from expenditure totals.</p></div><div class="card"><h3>Monthly expenditure comparison</h3>${latest?`<p>Latest recorded month (${latest}): <b>${money(months[latest])}</b></p>`:'<p class="mu">No dated purchases with amounts yet.</p>'}${prev?`<p>Previous recorded month (${prev}): <b>${money(months[prev])}</b></p>`:''}<p>Month-on-month expenditure change: <b>${change===null?'Not enough monthly data':(change>0?'+':'')+change.toFixed(1)+'%'}</b></p><p class="mu">Expenditure change can reflect changes in the amount bought as well as prices; it is not by itself inflation.</p></div><div class="card"><h3>Estimated grocery price inflation</h3><p>Average change in unit price for comparable items: <b>${inflation===null?'Not enough comparable item data':(inflation>0?'+':'')+inflation.toFixed(1)+'%'}</b></p><p class="mu">${inflation===null?'Import dated purchases with item name, quantity, and amount for the same products in at least two months.':'Based on '+matched+' item(s) with quantity and amount recorded in both '+prev+' and '+latest+'. This is a simple unweighted estimate, not an official CPI measure.'}</p></div><div class="card"><h3>Purchase history</h3>${ps.length?ps.slice().reverse().map(p=>`<div class="row"><span class="n">${esc(p.name)}</span><span>${esc(p.qty)}</span><span>${p.amount===''?'â€”':money(p.amount)}</span><span class="mu">${esc(p.date||'')}</span></div>`).join(''):'<p class="mu">No purchase list imported yet.</p>'}</div>`;
}

 const b=new Blob([pdf],{type:'application/pdf'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='shopping-list-'+today()+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);msg='Shopping list PDF downloaded.'}
document.addEventListener('change',e=>{if(e.target.id=='availlvl'){availLvl=e.target.value;e.stopImmediatePropagation();render()}},true);

document.addEventListener('input',e=>{const el=e.target,id=el.id;if(id!='invq'&&id!='availq'&&id!='buyq')return;const v=el.value,p=el.selectionStart;
 if(id=='invq')invQ=v;else if(id=='availq')availQ=v;else buyQ=v;render();
 const n=$('#'+id);if(n&&n.focus){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem('gt',JSON.stringify(S))}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){try{localStorage.setItem('gt',JSON.stringify(S))}catch(e){}}});
render();popup();
